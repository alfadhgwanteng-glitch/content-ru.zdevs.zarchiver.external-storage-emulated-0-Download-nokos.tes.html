<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSOCIATY • Menu Premium</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b12;
            background-image: 
                radial-gradient(circle at 20% 30%, #1a1a3e 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, #1a0a2e 0%, transparent 60%),
                linear-gradient(180deg, #0b0b12 0%, #141425 100%);
            padding: 20px;
            margin: 0;
            position: relative;
        }

        /* ===== GLOW ORB ===== */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 200, 255, 0.02) 0%, transparent 70%);
            animation: orbPulse 8s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes orbPulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.3; }
            100% { transform: scale(1.5) rotate(10deg); opacity: 0.8; }
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 48px;
            padding: 40px 32px;
            box-shadow: 
                0 40px 100px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.04),
                0 0 80px rgba(0, 180, 255, 0.03);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 36px;
            position: relative;
        }

        .header .badge {
            display: inline-block;
            background: rgba(0, 200, 255, 0.08);
            border: 1px solid rgba(0, 200, 255, 0.12);
            border-radius: 100px;
            padding: 4px 18px;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(0, 200, 255, 0.5);
            margin-bottom: 14px;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00e5ff 0%, #7a3aff 50%, #ff3acb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            line-height: 1.1;
            text-shadow: 0 0 60px rgba(0, 200, 255, 0.05);
        }

        .header .sub {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .header .sub span {
            color: rgba(0, 200, 255, 0.25);
        }

        /* ===== MENU ===== */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 20px 26px;
            display: flex;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.02), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .menu-card:hover {
            transform: translateY(-3px) scale(1.01);
            border-color: rgba(0, 200, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(0, 200, 255, 0.02);
        }

        .menu-card:hover::before {
            opacity: 1;
        }

        .menu-card .icon {
            font-size: 2.2rem;
            flex-shrink: 0;
            filter: drop-shadow(0 0 10px rgba(0, 200, 255, 0.1));
            transition: transform 0.3s ease;
        }

        .menu-card:hover .icon {
            transform: scale(1.1) rotate(-3deg);
        }

        .menu-card .info {
            flex: 1;
            z-index: 1;
        }

        .menu-card .info h3 {
            color: #fff;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .menu-card .info p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .menu-card .arrow {
            color: rgba(255, 255, 255, 0.08);
            font-size: 1.4rem;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .menu-card:hover .arrow {
            color: #00e5ff;
            transform: translateX(6px);
        }

        /* ===== DETAIL PAGE ===== */
        .detail-page {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .detail-page.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 8px 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .back-btn:hover {
            background: rgba(0, 200, 255, 0.08);
            border-color: rgba(0, 200, 255, 0.15);
            color: #fff;
            transform: translateX(-4px);
        }

        .back-btn .arrow-left {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .back-btn:hover .arrow-left {
            transform: translateX(-4px);
        }

        .detail-title {
            color: #fff;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .detail-title span {
            background: linear-gradient(135deg, #00e5ff, #7a3aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== KONTEN DETAIL ===== */
        .detail-content {
            padding: 10px 0;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 28px 30px;
            text-align: center;
        }

        .info-box .big-icon {
            font-size: 3.4rem;
            margin-bottom: 12px;
            display: block;
        }

        .info-box .label {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        .info-box .value {
            color: #fff;
            font-size: 1.4rem;
            font-weight: 600;
            word-break: break-all;
            background: rgba(0, 200, 255, 0.03);
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: inline-block;
        }

        .info-box .value.whatsapp {
            color: #25D366;
        }

        .info-box .value.telegram {
            color: #26A5E4;
        }

        .info-box .value.testimoni {
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.9rem;
            font-weight: 300;
            border-style: dashed;
        }

        .info-box .btn-action {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 36px;
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.12), rgba(122, 58, 255, 0.12));
            border: 1px solid rgba(0, 200, 255, 0.1);
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .info-box .btn-action:hover {
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.2), rgba(122, 58, 255, 0.2));
            border-color: rgba(0, 200, 255, 0.2);
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.05);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.06);
            letter-spacing: 2px;
        }

        .footer span {
            color: rgba(0, 200, 255, 0.08);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 28px 18px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 2.2rem;
            }
            .menu-card {
                padding: 16px 20px;
                gap: 14px;
            }
            .menu-card .icon {
                font-size: 1.6rem;
            }
            .menu-card .info h3 {
                font-size: 1rem;
            }
            .detail-title {
                font-size: 1.1rem;
            }
            .info-box {
                padding: 20px 16px;
            }
            .info-box .value {
                font-size: 1.1rem;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">

    <!-- ===== MENU UTAMA ===== -->
    <div id="menuPage" class="menu-page">
        <div class="header">
            <div class="badge">✦ FSOCIATY v3.0</div>
            <h1>⚡ Pilih Menu</h1>
            <div class="sub">— <span>super</span> black hat —</div>
        </div>

        <div class="menu-grid">
            <!-- MENU 1: WhatsApp -->
            <div class="menu-card" onclick="openDetail('whatsapp')">
                <div class="icon">💬</div>
                <div class="info">
                    <h3>via WhatsApp</h3>
                    <p>Hubungi langsung via WhatsApp</p>
                </div>
                <div class="arrow">➜</div>
            </div>

            <!-- MENU 2: Telegram -->
            <div class="menu-card" onclick="openDetail('telegram')">
                <div class="icon">✈️</div>
                <div class="info">
                    <h3>via Telegram</h3>
                    <p>Chat via Telegram</p>
                </div>
                <div class="arrow">➜</div>
            </div>

            <!-- MENU 3: Testimoni -->
            <div class="menu-card" onclick="openDetail('testimoni')">
                <div class="icon">⭐</div>
                <div class="info">
                    <h3>Testimoni</h3>
                    <p>Lihat testimoni pengguna</p>
                </div>
                <div class="arrow">➜</div>
            </div>
        </div>

        <div class="footer">
            <span>#FSOCIATY</span> • 3 menu siap pakai
        </div>
    </div>

    <!-- ===== DETAIL PAGE ===== -->
    <div id="detailPage" class="detail-page">
        <div class="detail-header">
            <button class="back-btn" onclick="goBack()">
                <span class="arrow-left">←</span> Kembali
            </button>
            <div class="detail-title">
                <span id="detailTitle">Detail</span>
            </div>
        </div>

        <div class="detail-content" id="detailContent">
            <!-- konten akan diisi oleh JS -->
        </div>
    </div>

</div>

<script>
    // ===== DATA =====
    const data = {
        whatsapp: {
            title: 'WhatsApp',
            icon: '💬',
            label: 'Nomor WhatsApp',
            value: '+6285814181099',
            isLink: true,
            link: 'https://wa.me/6285814181099',
            linkText: 'Hubungi via WhatsApp →'
        },
        telegram: {
            title: 'Telegram',
            icon: '✈️',
            label: 'Username Telegram',
            value: '@Alpadganteng',
            isLink: true,
            link: 'https://t.me/Alpadganteng',
            linkText: 'Chat via Telegram →'
        },
        testimoni: {
            title: 'Testimoni',
            icon: '⭐',
            label: 'Kosong',
            value: 'Belum ada testimoni',
            isLink: false
        }
    };

    // ===== ELEMENTS =====
    const menuPage = document.getElementById('menuPage');
    const detailPage = document.getElementById('detailPage');
    const detailTitle = document.getElementById('detailTitle');
    const detailContent = document.getElementById('detailContent');

    // ===== FUNCTIONS =====
    function openDetail(key) {
        const item = data[key];
        if (!item) return;

        // Set title
        detailTitle.innerHTML = `<span>${item.icon}</span> ${item.title}`;

        // Build content
        let html = `
            <div class="info-box">
                <span class="big-icon">${item.icon}</span>
                <div class="label">${item.label}</div>
                <div class="value ${key}">${item.value}</div>
        `;

        if (item.isLink && item.link) {
            html += `
                <br>
                <a href="${item.link}" target="_blank" class="btn-action">${item.linkText}</a>
            `;
        }

        html += `</div>`;

        detailContent.innerHTML = html;

        // Toggle pages
        menuPage.style.display = 'none';
        detailPage.classList.add('active');
    }

    function goBack() {
        menuPage.style.display = 'block';
        detailPage.classList.remove('active');
    }

    // ===== KEYBOARD SHORTCUT: ESC =====
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && detailPage.classList.contains('active')) {
            goBack();
        }
    });

    // ===== SWIPE BACK (touch) =====
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', function(e) {
        touchStartX = e.changedTouches[0].screenX;
    });

    document.addEventListener('touchend', function(e) {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (diff > 60 && detailPage.classList.contains('active')) {
            goBack();
        }
    });
</script>

</body>
</html>
